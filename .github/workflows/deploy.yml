name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --legacy-peer-deps
      - run: npm run build
      - name: Determine output path
        run: |
          if [ -d ".output/public" ]; then
            echo "OUT_PATH=.output/public" >> $GITHUB_ENV
          elif [ -d "dist/client" ]; then
            echo "OUT_PATH=dist/client" >> $GITHUB_ENV
          elif [ -d "dist/public" ]; then
            echo "OUT_PATH=dist/public" >> $GITHUB_ENV
          else
            echo "OUT_PATH=dist" >> $GITHUB_ENV
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUT_PATH }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
